name: Build and Deploy Project Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "scripts/build_dashboard_data.py"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PARATRANZ_PROJECT_ID: "19621"
      PROJECT_PARTICIPANTS: "8"
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build live dashboard data
        run: python scripts/build_dashboard_data.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
