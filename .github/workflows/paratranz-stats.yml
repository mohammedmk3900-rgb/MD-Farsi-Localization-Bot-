name: Update ParaTranz Discord Stats

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: paratranz-discord-stats
  cancel-in-progress: true

jobs:
  update:
    name: Sync ParaTranz statistics to Discord
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PARATRANZ_PROJECT_ID: "19621"
      PROJECT_PARTICIPANTS: "8"
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_STATS_MESSAGE_ID: ${{ vars.DISCORD_STATS_MESSAGE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync statistics
        id: sync
        run: python scripts/paratranz_stats.py

      - name: Save Discord message ID
        if: steps.sync.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.sync.outputs.message_id }}
        run: gh variable set DISCORD_STATS_MESSAGE_ID --body "$MESSAGE_ID"
