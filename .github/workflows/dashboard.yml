name: MD Farsi Command Center V8
on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "dashboard/**"
      - "data/glossary_official.md"
      - ".github/workflows/**"
      - "pyproject.toml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: md-farsi-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      PARATRANZ_PROJECT_ID: "19621"
      PROJECT_PARTICIPANTS: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Run V8 data engine
        run: |
          python -m py_compile scripts/command_center/*.py scripts/command_center/collectors/*.py scripts/command_center/services/*.py
          python scripts/command_center/runner.py
          python scripts/build_dashboard_data.py
      - name: Validate public payload
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dashboard/public/data/dashboard.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"] == 8
          assert "stats" in d and "automation" in d and "health" in d
          assert "PARATRANZ_TOKEN" not in p.read_text(encoding="utf-8")
          print("V8 public contract OK")
          PY
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Build React dashboard
        working-directory: dashboard
        run: npm install && npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: dashboard/dist}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
