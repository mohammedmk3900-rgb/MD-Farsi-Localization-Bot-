name: MD Farsi Unified Platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [all, daily, weekly, validate]
        default: all
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: md-farsi-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate all components
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Platform tests
        working-directory: platform
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m compileall -q app
      - name: Discord MCP tests
        working-directory: discord-mcp
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s . -p "test_*.py" -v
          python -m py_compile server.py indexer.py bot.py run.py
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust tests
        working-directory: rust
        run: |
          cargo test
          cargo build

  operate:
    name: Run coordinated platform jobs
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode != 'validate'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: platform
    env:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      PARATRANZ_PROJECT_ID: "19621"
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      CHANNEL_STATS: ${{ secrets.CHANNEL_STATS }}
      CHANNEL_PROGRESS: ${{ secrets.CHANNEL_PROGRESS }}
      CHANNEL_ACHIEVEMENTS: ${{ secrets.CHANNEL_ACHIEVEMENTS }}
      CHANNEL_HEALTH: ${{ secrets.CHANNEL_HEALTH }}
      CHANNEL_REPORTS: ${{ secrets.CHANNEL_REPORTS }}
      CHANNEL_GLOSSARY: ${{ secrets.CHANNEL_GLOSSARY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Restore previous durable runtime state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          mkdir -p data discord-mcp/data
          # Find the newest completed unified run with an available artifact.
          # Missing or expired artifacts are safe: use the checked-out seed.
          for run_id in $(gh run list --workflow unified-platform.yml --branch main --status completed --limit 12 --json databaseId --jq '.[].databaseId'); do
            mkdir -p "$RUNNER_TEMP/previous-state"
            if gh run download "$run_id" --name "platform-run-$run_id" --dir "$RUNNER_TEMP/previous-state"; then
              previous_platform="$RUNNER_TEMP/previous-state/platform/data/platform.db"
              previous_discord="$RUNNER_TEMP/previous-state/discord-mcp/data/discord.db"
              if [[ -s "$previous_platform" ]] && python -c 'import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; db.close()' "$previous_platform"; then
                cp "$previous_platform" data/platform.db
                if [[ -s "$previous_discord" ]] && python -c 'import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; db.close()' "$previous_discord"; then
                  cp "$previous_discord" discord-mcp/data/discord.db
                fi
                echo "Restored verified runtime databases from run $run_id"
                break
              fi
            fi
          done
      - name: Index Discord history
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_DB_PATH: data/discord.db
          DISCORD_BACKFILL_ON_START: "false"
        working-directory: discord-mcp
        run: |
          python -m pip install -r requirements.txt
          python - <<'PY'
import asyncio
import os
from server import sync_server_history
result = asyncio.run(sync_server_history())
print(result)
PY
      - name: Select report schedule
        id: reports
        shell: bash
        env:
          RUN_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          daily=false
          weekly=false
          if [[ "$RUN_MODE" == "daily" || "$RUN_MODE" == "weekly" ]]; then daily=true; fi
          if [[ "$RUN_MODE" == "weekly" ]]; then weekly=true; fi
          if [[ "$EVENT_NAME" == "schedule" && "$(date -u +%H)" == "18" ]]; then
            daily=true
            if [[ "$(date -u +%u)" == "1" ]]; then weekly=true; fi
          fi
          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
      - name: Run all coordinated jobs
        id: orchestrate
        continue-on-error: true
        env:
          DAILY: ${{ steps.reports.outputs.daily }}
          WEEKLY: ${{ steps.reports.outputs.weekly }}
        run: |
          args=()
          if [[ "$DAILY" == "true" ]]; then args+=(--daily); fi
          if [[ "$WEEKLY" == "true" ]]; then args+=(--weekly); fi
          python -m app.orchestrator "${args[@]}"
      - name: Verify SQLite before archiving
        if: always()
        shell: bash
        run: |
          if [[ -f data/platform.db ]]; then
            python -c 'import sqlite3; db=sqlite3.connect("data/platform.db"); assert db.execute("PRAGMA integrity_check").fetchone()[0] == "ok"; db.close()'
          fi
      - name: Archive runtime SQLite and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-run-${{ github.run_id }}
          path: |
            platform/data/platform.db
            platform/data/*.json
            discord-mcp/data/discord.db
          if-no-files-found: warn
          retention-days: 30
      - name: Publish public JSON snapshots only
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -d data ]]; then
            find data -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 -r git add --
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh public platform snapshots"
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 3))"
          done
          exit 1
      - name: Fail if any operational job failed
        if: steps.orchestrate.outcome == 'failure'
        run: exit 1
