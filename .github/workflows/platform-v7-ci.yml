name: Platform V7 CI
on:
 pull_request:
  paths: ["dashboard/**","scripts/command_center/**","pyproject.toml","rust/**",".github/workflows/platform-v7-ci.yml"]
permissions: {contents: read}
jobs:
 python:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-python@v5
     with: {python-version: "3.12"}
   - run: python -m py_compile scripts/command_center/*.py scripts/command_center/collectors/*.py scripts/command_center/services/*.py
   - run: python -m unittest discover -s tests -p "test_*.py" -v
 dashboard:
  runs-on: ubuntu-latest
  defaults: {run: {working-directory: dashboard}}
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-node@v4
     with: {node-version: "22"}
   - run: npm install
   - run: npm run build
