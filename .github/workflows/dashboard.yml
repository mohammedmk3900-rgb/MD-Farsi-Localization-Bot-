name: Build and Deploy Project Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"
  push:
    branches: ["main"]
    paths:
      - "dashboard/**"
      - "scripts/build_dashboard_data.py"
      - ".github/workflows/dashboard.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PARATRANZ_PROJECT_ID: "19621"
  PROJECT_PARTICIPANTS: "8"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect Command Center snapshot
        run: python scripts/command_center_snapshot.py

      - name: Validate dashboard data pipeline
        run: |
          set -euo pipefail
          python -m py_compile scripts/command_center_snapshot.py scripts/build_dashboard_data.py
          python scripts/build_dashboard_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("dashboard/data/dashboard.json").read_text(encoding="utf-8"))
          assert d["schema"] == 3
          assert "stats" in d and "sections" in d
          print("Dashboard data validated.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
