name: Update ParaTranz Discord Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: paratranz-discord-sync
  cancel-in-progress: true

jobs:
  update:
    name: Sync ParaTranz statistics and progress
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PARATRANZ_PROJECT_ID: "19621"
      PROJECT_PARTICIPANTS: "8"
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
      DISCORD_STATS_MESSAGE_ID: ${{ vars.DISCORD_STATS_MESSAGE_ID }}
      DISCORD_PROGRESS_MESSAGE_ID: ${{ vars.DISCORD_PROGRESS_MESSAGE_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync statistics
        id: stats
        run: python scripts/paratranz_stats.py

      - name: Save statistics message ID
        if: steps.stats.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.stats.outputs.message_id }}
        run: gh variable set DISCORD_STATS_MESSAGE_ID --body "$MESSAGE_ID"

      - name: Sync progress
        id: progress
        run: python scripts/paratranz_progress.py

      - name: Save progress message ID
        if: steps.progress.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.progress.outputs.message_id }}
        run: gh variable set DISCORD_PROGRESS_MESSAGE_ID --body "$MESSAGE_ID"
