name: Discord Audit Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/discord_audit.py"
      - ".github/workflows/discord-audit.yml"

concurrency:
  group: discord-audit
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check required secrets
        env:
          TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD: ${{ secrets.DISCORD_GUILD_ID }}
        run: |
          test -n "$TOKEN" || { echo "::error::DISCORD_BOT_TOKEN secret is missing"; exit 1; }
          test -n "$GUILD" || { echo "::error::DISCORD_GUILD_ID secret is missing"; exit 1; }

      - name: Install audit dependency
        run: pip install "httpx>=0.27,<1"

      - name: Collect sanitized Discord audit
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_AUDIT_RECENT_MESSAGES: "200"
        run: python scripts/discord_audit.py

      - name: Validate public-safe snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/discord_audit.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"] == 1
          assert d["privacy"]["message_content_stored"] is False
          assert d["privacy"]["member_names_stored"] is False
          assert d["privacy"]["member_ids_stored"] is False
          assert d["privacy"]["bot_token_stored"] is False
          assert "DISCORD_BOT_TOKEN" not in p.read_text(encoding="utf-8")
          print("Discord audit public-safety contract: OK")
          PY

      - name: Commit latest audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discord_audit.json
          git diff --cached --quiet || git commit -m "chore: refresh Discord audit snapshot"
          git push origin HEAD:main
