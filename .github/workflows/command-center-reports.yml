name: Command Center Reports

on:
  workflow_dispatch:
    inputs:
      period:
        description: "گزارش"
        required: true
        default: daily
        type: choice
        options:
          - daily
          - weekly
  schedule:
    - cron: "30 18 * * *"
    - cron: "45 18 * * 1"

permissions:
  contents: read

concurrency:
  group: command-center-reports
  cancel-in-progress: true

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_REPORTS_WEBHOOK_URL: ${{ secrets.DISCORD_REPORTS_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Daily report
        if: github.event_name == 'workflow_dispatch' && inputs.period == 'daily' || github.event_name == 'schedule' && github.event.schedule == '30 18 * * *'
        env:
          REPORT_PERIOD: daily
        run: python scripts/paratranz_reports.py

      - name: Weekly report
        if: github.event_name == 'workflow_dispatch' && inputs.period == 'weekly' || github.event_name == 'schedule' && github.event.schedule == '45 18 * * 1'
        env:
          REPORT_PERIOD: weekly
        run: python scripts/paratranz_reports.py
