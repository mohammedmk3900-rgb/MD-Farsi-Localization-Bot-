name: MD Farsi Platform Jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: "Platform job"
        required: true
        default: sync
        type: choice
        options:
          - sync
          - report-daily
          - report-weekly
          - glossary-sync
          - health
          - audit
  schedule:
    - cron: "0 */6 * * *"
    - cron: "30 18 * * *"
    - cron: "45 18 * * 1"

permissions:
  contents: write

concurrency:
  group: md-farsi-platform-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    env:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      PARATRANZ_PROJECT_ID: "19621"
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      CHANNEL_STATS: ${{ secrets.CHANNEL_STATS }}
      CHANNEL_PROGRESS: ${{ secrets.CHANNEL_PROGRESS }}
      CHANNEL_ACHIEVEMENTS: ${{ secrets.CHANNEL_ACHIEVEMENTS }}
      CHANNEL_HEALTH: ${{ secrets.CHANNEL_HEALTH }}
      CHANNEL_REPORTS: ${{ secrets.CHANNEL_REPORTS }}
      CHANNEL_GLOSSARY: ${{ secrets.CHANNEL_GLOSSARY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - run: python -m pip install --upgrade pip
      - run: pip install -e .

      - name: Six-hour platform sync
        if: (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'sync')
        run: python -m app.cli sync

      - name: Daily report
        if: (github.event_name == 'schedule' && github.event.schedule == '30 18 * * *') || (github.event_name == 'workflow_dispatch' && inputs.job == 'report-daily')
        run: python -m app.cli report --period daily

      - name: Weekly report
        if: (github.event_name == 'schedule' && github.event.schedule == '45 18 * * 1') || (github.event_name == 'workflow_dispatch' && inputs.job == 'report-weekly')
        run: python -m app.cli report --period weekly

      - name: Glossary sync
        if: (github.event_name == 'workflow_dispatch' && inputs.job == 'glossary-sync') || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
        run: python -m app.cli glossary-sync

      - name: Health check
        if: (github.event_name == 'workflow_dispatch' && inputs.job == 'health') || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
        run: python -m app.cli health

      - name: Discord audit
        if: (github.event_name == 'workflow_dispatch' && inputs.job == 'audit') || (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *')
        run: python -m app.cli audit

      - name: Persist public operational snapshots
        if: success() && (github.event_name == 'schedule' && github.event.schedule == '0 */6 * * *' || github.event_name == 'workflow_dispatch' && (inputs.job == 'glossary-sync' || inputs.job == 'audit' || inputs.job == 'sync'))
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Never commit the live SQLite database or its journal files.
          # Only stable, reviewable public JSON snapshots belong in Git.
          if [ -d data ]; then
            find data -type f -name '*.json' -print0 | xargs -0 -r git add --
          fi

          if git diff --cached --quiet; then
            echo "No public operational snapshot changes to persist."
            exit 0
          fi

          git commit -m "chore: refresh public platform JSON snapshots"

          # The concurrency group serializes this workflow, but other workflows
          # may still update main. Retry only text-based JSON snapshot rebases.
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 3))
          done
          echo "::error::Unable to publish snapshots after three attempts."
          exit 1
