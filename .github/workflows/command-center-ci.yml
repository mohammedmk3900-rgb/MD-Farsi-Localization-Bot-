name: Command Center V6 CI

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/command-center-ci.yml"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/command-center-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Compile and unit test
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/command_center/*.py \
            scripts/command_center/collectors/*.py \
            scripts/command_center/services/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
