name: Update ParaTranz Discord Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: paratranz-discord-sync
  cancel-in-progress: true

jobs:
  update:
    name: Sync ParaTranz Discord data
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      PARATRANZ_PROJECT_ID: "19621"
      PROJECT_PARTICIPANTS: "8"
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
      DISCORD_ACHIEVEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ACHIEVEMENTS_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync statistics
        id: stats
        run: python scripts/paratranz_stats.py

      - name: Save progress message ID
        if: steps.progress.outputs.message_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.progress.outputs.message_id }}
        run: gh variable set DISCORD_PROGRESS_MESSAGE_ID --body "$MESSAGE_ID"

      - name: Check achievements
        run: python scripts/paratranz_achievements.py

      - name: Persist bot state
        if: always()
        run: |
          if git diff --quiet -- data/discord_messages.json data/achievements.json; then
            echo "No bot state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/discord_messages.json data/achievements.json
          git commit -m "chore: persist Discord bot state"
          git push
