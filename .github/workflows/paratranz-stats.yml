name: Update ParaTranz Discord Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: paratranz-discord-sync
  cancel-in-progress: true

jobs:
  update:
    name: Sync ParaTranz Discord Command Center
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PARATRANZ_PROJECT_ID: "19621"
      PROJECT_PARTICIPANTS: "8"
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
      DISCORD_ACHIEVEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ACHIEVEMENTS_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Python
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/paratranz_stats.py \
            scripts/paratranz_progress.py \
            scripts/paratranz_achievements.py \
            scripts/command_center_snapshot.py \
            scripts/build_discord_visuals.py \
            scripts/build_dashboard_data.py

      - name: Collect Command Center snapshot
        id: snapshot
        run: python scripts/command_center_snapshot.py

      - name: Verify snapshot
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/command_center.json")
          if not p.exists():
              raise SystemExit("Snapshot was not created.")
          d=json.loads(p.read_text(encoding="utf-8"))
          for key in ("schema","timestamp","project","progress","health","automation"):
              if key not in d:
                  raise SystemExit(f"Snapshot missing: {key}")
          if d["schema"] != 3:
              raise SystemExit(f"Unsupported snapshot schema: {d['schema']}")
          print("Snapshot verified:", d["stats"]["translated"], "/", d["stats"]["strings"])
          PY

      - name: Generate Discord visuals
        run: python scripts/build_discord_visuals.py


      - name: Generate Command Center history
        run: |
          python scripts/build_discord_history.py
          python scripts/build_discord_visuals.py

      - name: Validate Discord state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ("data/command_center.json","data/discord_history.json","data/discord_messages.json","data/achievements.json"):
              p=Path(name)
              if not p.exists():
                  raise SystemExit(f"Missing state file: {name}")
              json.loads(p.read_text(encoding="utf-8"))
          for name in ("assets/discord/stats.svg","assets/discord/progress.svg","assets/discord/progress-history.svg"):
              p=Path(name)
              if not p.exists() or "<svg" not in p.read_text(encoding="utf-8")[:500]:
                  raise SystemExit(f"Invalid visual: {name}")
          print("Command Center state and visuals verified.")
          PY

      - name: Sync statistics
        id: stats
        run: python scripts/paratranz_stats.py

      - name: Sync progress
        id: progress
        run: python scripts/paratranz_progress.py

      - name: Check achievements
        run: python scripts/paratranz_achievements.py

      - name: Persist Command Center state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            data/discord_messages.json \
            data/achievements.json \
            data/discord_history.json \
            data/command_center.json \
            assets/discord/stats.svg \
            assets/discord/progress.svg \
            assets/discord/progress-history.svg
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          if git diff --cached --quiet; then
            echo "No Command Center state changes."
            exit 0
          fi

          git commit -m "chore: update Discord Command Center state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Push attempt $attempt failed; retrying after backoff..."
              sleep $((attempt * 5))
            fi
          done
          echo "Failed to push Command Center state after 3 attempts." >&2
          exit 1
