name: Discord MCP
on:
  pull_request:
    paths: ["discord-mcp/**",".github/workflows/discord-mcp.yml"]
  push:
    branches: [main,"feat/**","fix/**"]
    paths: ["discord-mcp/**",".github/workflows/discord-mcp.yml"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile server.py indexer.py bot.py run.py
      - name: Regression tests
        run: python -m unittest discover -s . -p "test_*.py" -v
