name: Validate Project

on:
  push:
    branches: ["main"]
    paths:
      - "platform/**"
      - "discord-mcp/**"
      - "rust/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "platform/**"
      - "discord-mcp/**"
      - "rust/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q app

  discord-mcp:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s . -p "test_*.py" -v
      - run: python -m py_compile server.py indexer.py bot.py run.py

  rust:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo build
