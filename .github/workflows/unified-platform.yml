name: MD Farsi Unified Platform

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options: [all, daily, weekly, validate]
        default: all
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

concurrency:
  group: md-farsi-unified-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate all components
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Platform tests
        working-directory: platform
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m compileall -q app

      - name: Discord MCP tests
        working-directory: discord-mcp
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python -m unittest discover -s . -p "test_*.py" -v
          python -m py_compile server.py indexer.py bot.py run.py
          DISCORD_BOT_TOKEN=test DISCORD_GUILD_ID=1 DISCORD_DB_PATH="$RUNNER_TEMP/discord-mcp-test.db" python -c "from server import mcp; print(type(mcp).__name__)"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust tests
        working-directory: rust
        run: |
          set -euo pipefail
          cargo test
          cargo build

      - name: Genesis Rust QA tests
        working-directory: genesis/engine/rust
        run: |
          cargo test
          cargo build --bin mdfarsi-qa

      - name: Setup Go 1.27.1
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Genesis Go worker tests
        working-directory: genesis/engine/go
        run: go test ./...

      - name: Build Genesis Go worker
        working-directory: genesis/engine/go
        run: go build -o worker ./cmd/worker

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: genesis/engine/typescript/package.json

      - name: Genesis TypeScript contract typecheck
        working-directory: genesis/engine/typescript
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run typecheck

      - name: Genesis C++ native build
        run: |
          set -euo pipefail
          cmake -S genesis/engine/cpp -B build/genesis-native
          cmake --build build/genesis-native
          cmake --version

      - name: Setup .NET 10 LTS
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Genesis C# bridge build
        working-directory: genesis/engine/csharp
        run: dotnet build --configuration Release

      - name: Archive polyglot runtime binaries
        uses: actions/upload-artifact@v7
        with:
          name: polyglot-binaries-${{ github.run_id }}
          path: |
            genesis/engine/rust/target/debug/mdfarsi-qa
            genesis/engine/go/worker
            build/genesis-native/md_native_probe
            genesis/engine/csharp/bin/Release/net10.0/MDNativeBridge
          if-no-files-found: error
          retention-days: 7

  operate:
    name: Run coordinated platform jobs
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && inputs.mode != 'validate'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    defaults:
      run:
        working-directory: platform
    env:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      PARATRANZ_PROJECT_ID: "19621"
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      CHANNEL_STATS: ${{ secrets.CHANNEL_STATS }}
      CHANNEL_PROGRESS: ${{ secrets.CHANNEL_PROGRESS }}
      CHANNEL_ACHIEVEMENTS: ${{ secrets.CHANNEL_ACHIEVEMENTS }}
      CHANNEL_HEALTH: ${{ secrets.CHANNEL_HEALTH }}
      CHANNEL_REPORTS: ${{ secrets.CHANNEL_REPORTS }}
      CHANNEL_GLOSSARY: ${{ secrets.CHANNEL_GLOSSARY }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14.7"

      - name: Download validated polyglot binaries
        uses: actions/download-artifact@v8
        with:
          name: polyglot-binaries-${{ github.run_id }}
          path: ${{ github.workspace }}

      - name: Restore executable permissions for validated polyglot binaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x \
            "$GITHUB_WORKSPACE/genesis/engine/rust/target/debug/mdfarsi-qa" \
            "$GITHUB_WORKSPACE/genesis/engine/go/worker" \
            "$GITHUB_WORKSPACE/build/genesis-native/md_native_probe"

      - name: Install platform
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Restore previous durable runtime state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/platform/data" "$GITHUB_WORKSPACE/discord-mcp/data"
          rm -rf "$RUNNER_TEMP/previous-state"
          mkdir -p "$RUNNER_TEMP/previous-state"

          restored=false
          while read -r run_id; do
            [[ -n "$run_id" ]] || continue
            rm -rf "$RUNNER_TEMP/previous-state"/*
            mkdir -p "$RUNNER_TEMP/previous-state"

            if ! gh run download "$run_id" --name "platform-run-$run_id" --dir "$RUNNER_TEMP/previous-state"; then
              continue
            fi

            previous_platform="$RUNNER_TEMP/previous-state/platform/data/platform.db"
            previous_discord="$RUNNER_TEMP/previous-state/discord-mcp/data/discord.db"

            if [[ -s "$previous_platform" ]] &&                python -c 'import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); ok=db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; db.close(); raise SystemExit(0 if ok else 1)' "$previous_platform"; then
              cp "$previous_platform" "$GITHUB_WORKSPACE/platform/data/platform.db"

              if [[ -s "$previous_discord" ]] &&                  python -c 'import sqlite3,sys; db=sqlite3.connect(sys.argv[1]); ok=db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; db.close(); raise SystemExit(0 if ok else 1)' "$previous_discord"; then
                cp "$previous_discord" "$GITHUB_WORKSPACE/discord-mcp/data/discord.db"
              fi

              echo "Restored verified runtime databases from run $run_id"
              restored=true
              break
            fi
          done < <(gh run list --workflow unified-platform.yml --branch main --status success --limit 12 --json databaseId --jq '.[].databaseId')

          if [[ "$restored" != "true" ]]; then
            echo "No verified previous runtime artifact found; using repository seed state."
          fi

      - name: Index Discord history
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          DISCORD_DB_PATH: data/discord.db
          DISCORD_BACKFILL_ON_START: "false"
        working-directory: discord-mcp
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          python - <<'PY'
          import asyncio
          from server import sync_server_history

          result = asyncio.run(sync_server_history())
          print(result)
          PY

      - name: Select report schedule
        id: reports
        shell: bash
        env:
          RUN_MODE: ${{ inputs.mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          daily=false
          weekly=false

          case "$RUN_MODE" in
            daily)
              daily=true
              ;;
            weekly)
              daily=true
              weekly=true
              ;;
          esac

          if [[ "$EVENT_NAME" == "schedule" && "$(date -u +%H)" == "18" ]]; then
            daily=true
            if [[ "$(date -u +%u)" == "1" ]]; then
              weekly=true
            fi
          fi

          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"

      - name: Run all coordinated jobs
        id: orchestrate
        continue-on-error: true
        env:
          DAILY: ${{ steps.reports.outputs.daily }}
          WEEKLY: ${{ steps.reports.outputs.weekly }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$DAILY" == "true" ]]; then args+=(--daily); fi
          if [[ "$WEEKLY" == "true" ]]; then args+=(--weekly); fi
          python -m app.orchestrator "${args[@]}"

      - name: Verify SQLite before archiving
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f data/platform.db ]]; then
            python -c 'import sqlite3; db=sqlite3.connect("data/platform.db"); ok=db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; db.close(); raise SystemExit(0 if ok else 1)'
          fi
          if [[ -f ../discord-mcp/data/discord.db ]]; then
            python -c 'import sqlite3; db=sqlite3.connect("../discord-mcp/data/discord.db"); ok=db.execute("PRAGMA integrity_check").fetchone()[0]=="ok"; db.close(); raise SystemExit(0 if ok else 1)'
          fi

      - name: Archive runtime SQLite and snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-run-${{ github.run_id }}
          path: |
            platform/data/platform.db
            platform/data/*.json
            discord-mcp/data/discord.db
          if-no-files-found: warn
          retention-days: 30

      - name: Prepare public snapshot commit
        if: steps.orchestrate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Runtime SQLite belongs in artifacts, not in Git history. Restore any
          # tracked DB to HEAD before rebasing so it can never reintroduce the
          # binary merge-conflict class this workflow is designed to avoid.
          git restore --worktree -- data/platform.db 2>/dev/null || true

          find data -maxdepth 1 -type f -name '*.json' -print0 | xargs -0 -r git add --

          if git diff --cached --quiet; then
            echo "No public JSON snapshot changes to publish."
            exit 0
          fi

          git commit -m "chore: refresh public platform snapshots"

      - name: Publish public JSON snapshots only
        if: steps.orchestrate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              # The generated JSON is authoritative for this run. If another
              # run changed the same snapshot files, resolve only those files
              # in favor of the current run and continue the rebase.
              if git diff --name-only --diff-filter=U | grep -Eq '^platform/data/.*\.json$'; then
                git checkout --theirs -- data/*.json
                git add data/*.json
                GIT_EDITOR=true git rebase --continue
                if git push origin HEAD:main; then
                  exit 0
                fi
              else
                git rebase --abort || true
              fi
            fi

            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 3))"
          done

          echo "Failed to publish public JSON snapshots after 3 attempts." >&2
          exit 1

      - name: Fail if any operational job failed
        if: steps.orchestrate.outcome == 'failure'
        run: exit 1
