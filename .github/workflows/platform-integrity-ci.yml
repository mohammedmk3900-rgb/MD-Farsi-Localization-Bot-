name: Platform Integrity CI

on:
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-jobs.yml"
      - ".github/workflows/platform-integrity-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  platform-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/pyproject.toml
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
