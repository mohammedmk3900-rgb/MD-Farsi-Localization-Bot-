[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "md-farsi-localization-platform"
version = "1.0.0"
description = "Production platform for Millennium Dawn Farsi Localization"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "discord.py==2.7.1",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
