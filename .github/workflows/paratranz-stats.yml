name: MD Farsi Localization Command Center

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: md-farsi-command-center
  cancel-in-progress: true

jobs:
  command-center:
    name: Command Center V6
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARATRANZ_PROJECT_ID: "19621"
      PROJECT_PARTICIPANTS: "8"
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_PROGRESS_WEBHOOK_URL: ${{ secrets.DISCORD_PROGRESS_WEBHOOK_URL }}
      DISCORD_ACHIEVEMENTS_WEBHOOK_URL: ${{ secrets.DISCORD_ACHIEVEMENTS_WEBHOOK_URL }}
      DISCORD_HEALTH_WEBHOOK_URL: ${{ secrets.DISCORD_HEALTH_WEBHOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate source
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/command_center/*.py \
            scripts/command_center/collectors/*.py \
            scripts/command_center/services/*.py \
            scripts/build_discord_visuals.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Generate visuals
        run: python scripts/build_discord_visuals.py

      - name: Run Command Center V6
        run: python scripts/command_center/runner.py

      - name: Verify persisted state
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data/command_center.json",
              "data/command_center_records.json",
              "data/discord_history.json",
              "data/discord_messages.json",
              "data/achievements.json",
          ]
          for name in required:
              path = Path(name)
              if not path.exists():
                  raise SystemExit(f"Missing state file: {name}")
              json.loads(path.read_text(encoding="utf-8"))

          snapshot = json.loads(Path("data/command_center.json").read_text(encoding="utf-8"))
          if snapshot.get("schema") != 6:
              raise SystemExit(f"Expected Command Center schema 6, got {snapshot.get('schema')}")
          print("Command Center V6 state verified.")
          PY

      - name: Persist Command Center state
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            data/command_center.json \
            data/command_center_records.json \
            data/discord_history.json \
            data/discord_messages.json \
            data/achievements.json \
            assets/discord/stats.svg \
            assets/discord/progress.svg \
            assets/discord/progress-history.svg
          do
            [ -f "$file" ] && git add "$file"
          done

          if git diff --cached --quiet; then
            echo "No Command Center state changes."
            exit 0
          fi

          git commit -m "chore: update Command Center V6 state"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "State pushed successfully."
              exit 0
            fi
            [ "$attempt" -lt 3 ] && sleep $((attempt * 5))
          done

          echo "Failed to persist Command Center state." >&2
          exit 1
