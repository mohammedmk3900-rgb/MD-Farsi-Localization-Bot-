<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07111f"><meta name="description" content="Millennium Dawn Farsi Localization — live project dashboard">
<title>MD Farsi Localization • Command Center</title>
<style>
:root{--bg:#050b14;--line:#1b2a3e;--text:#edf5ff;--muted:#8fa5bd;--blue:#42a5ff;--green:#35d07f;--gold:#f4c64e;--purple:#a879ff;--shadow:0 24px 70px #0008}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -10%,#12345c 0,#07111f 35%,#040911 75%);color:var(--text);font-family:Inter,Segoe UI,Tahoma,Arial,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.16;background-image:linear-gradient(#fff 1px,transparent 1px),linear-gradient(90deg,#fff 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,#000,transparent 65%)}
.wrap{width:min(1240px,calc(100% - 32px));margin:auto}.top{padding:42px 0 22px;display:flex;align-items:flex-end;justify-content:space-between;gap:20px}.eyebrow{color:#8db8df;font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}.brand{font-size:clamp(30px,5vw,58px);font-weight:900;line-height:1.02;margin:10px 0}.sub{color:var(--muted);max-width:720px;line-height:1.9}.live{display:flex;align-items:center;gap:9px;padding:10px 14px;border:1px solid #29415b;background:#0a1727;border-radius:999px;color:#bcd5ec;white-space:nowrap}.dot{width:9px;height:9px;background:var(--green);border-radius:50%;box-shadow:0 0 18px var(--green);animation:pulse 1.8s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.75)}}
.hero{position:relative;overflow:hidden;border:1px solid #243850;border-radius:30px;padding:30px;background:linear-gradient(135deg,#0b1a2cdd,#0a111dcc);box-shadow:var(--shadow);margin:18px 0 22px}.hero:after{content:"";position:absolute;width:360px;height:360px;border-radius:50%;left:-100px;top:-150px;background:radial-gradient(circle,#2697ff55,transparent 68%)}.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:center}.hero h1{font-size:clamp(27px,4vw,48px);margin:0 0 12px}.hero p{color:#a9bfd5;line-height:1.9}.cta{display:inline-flex;margin-top:12px;padding:12px 18px;border-radius:13px;background:#fff;color:#07111f;font-weight:850}.ring{width:min(260px,65vw);aspect-ratio:1;margin:auto;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--green) calc(var(--p)*1%),#16283c 0);position:relative;box-shadow:0 0 70px #35d07f22}.ring:before{content:"";position:absolute;inset:16px;border-radius:50%;background:#07111f;border:1px solid #243850}.ring .inside{position:relative;text-align:center}.big{font-size:48px;font-weight:950}.small{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.section{border:1px solid var(--line);background:linear-gradient(145deg,#0b1625dd,#08111cdd);border-radius:20px;box-shadow:0 15px 40px #0004}.card{padding:20px}.k{font-size:12px;color:var(--muted);font-weight:750}.v{font-size:28px;font-weight:900;margin-top:8px}.accent-blue{color:var(--blue)}.accent-green{color:var(--green)}.accent-gold{color:var(--gold)}.accent-purple{color:var(--purple)}
.section{padding:24px;margin-top:16px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:18px}.section h2{margin:0;font-size:21px}.muted{color:var(--muted)}.bars{display:grid;gap:16px}.bar-row{display:grid;gap:8px}.bar-label{display:flex;justify-content:space-between;font-size:13px}.track{height:12px;border-radius:99px;background:#15263a;overflow:hidden;border:1px solid #21364d}.fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#2476ff,#35d07f);box-shadow:0 0 18px #35d07f55;transition:width 1s ease}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;border-bottom:1px solid #17273a;text-align:right}.table th{color:#7f97b0;font-size:12px}.table td{font-size:13px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#122235;color:#9ec0df}.timeline{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.milestone{position:relative;padding:14px 10px;border:1px solid #1d3148;border-radius:16px;background:#0a1624;text-align:center;opacity:.45}.milestone.done{opacity:1;border-color:#2b5f54;background:#0b1c1a}.milestone .ico{font-size:25px}.milestone b{display:block;margin-top:7px}.footer{padding:35px 0 55px;color:#71869c;text-align:center;font-size:12px}.error{padding:25px;color:#ff9aaa;border:1px solid #603040;background:#210f18;border-radius:16px;margin-top:20px}
@media(max-width:900px){.hero-grid,.grid2{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.timeline{grid-template-columns:repeat(3,1fr)}.top{align-items:flex-start;flex-direction:column}}@media(max-width:560px){.wrap{width:min(100% - 20px,1240px)}.cards{grid-template-columns:1fr}.timeline{grid-template-columns:repeat(2,1fr)}.hero{padding:22px}.ring{width:210px}}
</style></head>
<body><main class="wrap">
<header class="top"><div><div class="eyebrow">MILLENNIUM DAWN • FARSI LOCALIZATION</div><div class="brand">Command Center</div><div class="sub">داشبورد زنده و تصویری پروژه؛ آمار از ParaTranz دریافت و به‌صورت خودکار بروزرسانی می‌شود.</div></div><div class="live"><span class="dot"></span><span id="liveText">در حال دریافت داده…</span></div></header>
<div id="app"><div class="section">در حال بارگذاری داشبورد…</div></div>
<footer class="footer">MD Farsi Localization • Automated Project Intelligence • <span id="updated">—</span></footer>
</main>
<script>
const fmt=n=>new Intl.NumberFormat("en-US").format(n||0),pct=n=>Number(n||0).toFixed(2)+"%",esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[c]));
function milestone(p,d){return [...d.milestones].reverse().find(x=>p>=x.threshold)||d.milestones[0]}
function render(d){
 const s=d.stats,p=Math.min(100,Math.max(0,s.translation_percent||0)),m=milestone(p,d);
 document.getElementById("liveText").textContent="داده زنده • همگام با ParaTranz";
 document.getElementById("updated").textContent="آخرین بروزرسانی: "+new Date(d.updated_at).toLocaleString("fa-IR");
 const rows=Object.entries(d.sections||{}).map(([k,v])=>"<tr><td><span class=\"pill\">"+esc(k)+"</span></td><td>"+fmt(v.files)+"</td><td>"+fmt(v.strings)+"</td><td>"+pct(v.translation_percent)+"</td></tr>").join("");
 const ms=d.milestones.map(x=>"<div class=\"milestone "+(p>=x.threshold?"done":"")+"\"><div class=\"ico\">"+x.icon+"</div><b>"+x.threshold+"%</b><span class=\"muted\">"+esc(x.label)+"</span></div>").join("");
 document.getElementById("app").innerHTML=
 "<section class=\"hero\"><div class=\"hero-grid\"><div><div class=\"eyebrow\">PROJECT "+d.project.id+"</div><h1>"+esc(d.project.name)+"</h1><p>یک نمای یکپارچه از وضعیت ترجمه، بازبینی، فایل‌ها و نقاط عطف پروژه. این صفحه بدون نمایش Token و فقط با snapshot عمومی داده کار می‌کند.</p><a class=\"cta\" href=\""+d.project.url+"\" target=\"_blank\" rel=\"noreferrer\">مشاهده پروژه در ParaTranz ↗</a></div><div class=\"ring\" style=\"--p:"+p+"\"><div class=\"inside\"><div class=\"big\">"+p.toFixed(2)+"%</div><div class=\"small\">پیشرفت ترجمه</div><div style=\"margin-top:8px\">"+m.icon+" "+esc(m.label)+"</div></div></div></div></section>"+
 "<section class=\"cards\"><div class=\"card\"><div class=\"k\">📝 ترجمه‌شده</div><div class=\"v accent-green\">"+fmt(s.translated)+"</div><div class=\"muted\">"+pct(p)+" از "+fmt(s.strings)+" رشته</div></div><div class=\"card\"><div class=\"k\">🔎 بازبینی‌شده</div><div class=\"v accent-blue\">"+fmt(s.reviewed)+"</div><div class=\"muted\">"+pct(s.review_percent)+" از کل</div></div><div class=\"card\"><div class=\"k\">📄 فایل‌ها</div><div class=\"v accent-purple\">"+fmt(s.files)+"</div><div class=\"muted\">فایل در پروژه</div></div><div class=\"card\"><div class=\"k\">👥 مشارکت‌کنندگان</div><div class=\"v accent-gold\">"+fmt(d.project.participants)+"</div><div class=\"muted\">"+fmt(s.words)+" کلمه</div></div></section>"+
 "<section class=\"section\"><div class=\"section-head\"><div><h2>📡 وضعیت زنده پروژه</h2><div class=\"muted\">Translation & Review telemetry</div></div></div><div class=\"bars\"><div class=\"bar-row\"><div class=\"bar-label\"><span>🌐 ترجمه</span><b>"+pct(p)+"</b></div><div class=\"track\"><div class=\"fill\" style=\"width:"+p+"%\"></div></div></div><div class=\"bar-row\"><div class=\"bar-label\"><span>🔎 بازبینی</span><b>"+pct(s.review_percent)+"</b></div><div class=\"track\"><div class=\"fill\" style=\"width:"+Math.min(100,s.review_percent)+"%\"></div></div></div></div></section>"+
 "<div class=\"grid2\"><section class=\"section\"><div class=\"section-head\"><div><h2>🗂️ پوشش فایل‌ها</h2><div class=\"muted\">تفکیک بر اساس مسیرهای پروژه</div></div></div><table class=\"table\"><thead><tr><th>بخش</th><th>فایل</th><th>رشته</th><th>ترجمه</th></tr></thead><tbody>"+rows+"</tbody></table></section><section class=\"section\"><div class=\"section-head\"><div><h2>🏆 مسیر دستاوردها</h2><div class=\"muted\">نقاط عطف ترجمه</div></div></div><div class=\"timeline\">"+ms+"</div></section></div>";
}
fetch("./data/dashboard.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(render).catch(e=>{document.getElementById("liveText").textContent="داده در دسترس نیست";document.getElementById("app").innerHTML="<div class=\"error\">خطا در بارگذاری داده داشبورد: "+esc(e.message)+"</div>"});
</script></body></html>
