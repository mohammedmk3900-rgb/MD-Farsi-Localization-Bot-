[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "md-news-genesis"
version = "11.0.0a2"
description = "MD Farsi Localization V11 Genesis production core"
requires-python = ">=3.12"
dependencies = [
    "discord.py>=2.4,<3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
