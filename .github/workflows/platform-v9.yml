name: MD Farsi Platform V9

on:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "dashboard/**"
      - "api/**"
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "dashboard/**"
      - "api/**"
      - "rust/**"
      - "pyproject.toml"
      - ".github/workflows/**"
  workflow_dispatch:
  schedule:
    - cron: "15 */6 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: md-farsi-v9
  cancel-in-progress: true

env:
  PARATRANZ_PROJECT_ID: "19621"
  PROJECT_PARTICIPANTS: "8"

jobs:
  python:
    name: Python Core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile scripts/command_center/*.py scripts/command_center/collectors/*.py scripts/command_center/services/*.py scripts/*.py
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Public contract test
        if: env.PARATRANZ_TOKEN != ''
        run: |
          python scripts/command_center/runner.py
          python scripts/build_dashboard_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("dashboard/public/data/dashboard.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"] == 8
          assert "stats" in d and "health" in d and "automation" in d
          raw=p.read_text(encoding="utf-8")
          assert "PARATRANZ_TOKEN" not in raw
          assert "DISCORD_" not in raw
          print("Python public contract: OK")
          PY

  rust:
    name: Rust Validation Engine
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test
      - name: Build
        run: cargo build --release
      - name: Validate protected tokens
        run: |
          printf '%s' '{"source":"Hello $NAME|H$ £GFX §YHello§!","target":"سلام $NAME|H$ £GFX §Yسلام§!"}' | target/release/md-farsi-engine
      - name: Reject broken protected tokens
        run: |
          set +e
          printf '%s' '{"source":"Hello $NAME|H$ £GFX §YHello§!","target":"سلام $OTHER|H$ £GFX §Yسلام§!"}' | target/release/md-farsi-engine
          test $? -eq 2

  typescript:
    name: TypeScript API and Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Dashboard build
        working-directory: dashboard
        run: npm install && npm run build
      - name: API build
        working-directory: api
        run: npm install && npm run build

  deploy:
    name: GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [python, rust, typescript]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate public dashboard data
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
        run: |
          python scripts/command_center/runner.py
          python scripts/build_dashboard_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build dashboard
        working-directory: dashboard
        run: npm install && npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/dist
      - id: deployment
        uses: actions/deploy-pages@v4
