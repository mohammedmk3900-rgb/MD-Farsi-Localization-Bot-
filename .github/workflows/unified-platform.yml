name: MD Farsi Unified Platform

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  schedule:
    # UTC. Daily: 03:17, Weekly: Sunday 03:23.
    - cron: "17 3 * * *"
    - cron: "23 3 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Operation mode"
        type: choice
        options: [all, daily, weekly, validate]
        default: all
        required: true
      restore_state:
        description: "Restore the latest verified durable runtime state"
        type: boolean
        default: true
        required: true
      publish_snapshots:
        description: "Publish generated public JSON snapshots to main"
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: md-farsi-unified-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.14.7"
  GO_VERSION: "1.27.1"
  NODE_VERSION: "24.21.0"
  DOTNET_VERSION: "10.0.x"
  PARATRANZ_PROJECT_ID: "19621"
  SQLITE_TIMEOUT: "30"

jobs:
  resolve-mode:
    name: Resolve execution mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      daily: ${{ steps.resolve.outputs.daily }}
      weekly: ${{ steps.resolve.outputs.weekly }}
      run_operations: ${{ steps.resolve.outputs.run_operations }}
      restore_state: ${{ steps.resolve.outputs.restore_state }}
      publish_snapshots: ${{ steps.resolve.outputs.publish_snapshots }}
    steps:
      - name: Resolve event policy
        id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          INPUT_MODE: ${{ inputs.mode || 'validate' }}
          INPUT_RESTORE: ${{ inputs.restore_state || false }}
          INPUT_PUBLISH: ${{ inputs.publish_snapshots || false }}
        run: |
          set -euo pipefail

          mode="validate"
          daily=false
          weekly=false
          run_operations=false
          restore_state=false
          publish_snapshots=false

          case "$EVENT_NAME" in
            workflow_dispatch)
              mode="$INPUT_MODE"
              restore_state="$INPUT_RESTORE"
              publish_snapshots="$INPUT_PUBLISH"
              if [[ "$mode" == "all" || "$mode" == "daily" || "$mode" == "weekly" ]]; then
                run_operations=true
              fi
              ;;

            schedule)
              case "$SCHEDULE" in
                '17 3 * * *')
                  mode="daily"
                  daily=true
                  ;;
                '23 3 * * 0')
                  mode="weekly"
                  daily=true
                  weekly=true
                  ;;
                *)
                  echo "::error::Unknown schedule: $SCHEDULE"
                  exit 1
                  ;;
              esac
              run_operations=true
              restore_state=true
              publish_snapshots=true
              ;;

            push)
              mode="validate"
              ;;

            pull_request)
              mode="validate"
              ;;

            *)
              echo "::error::Unsupported event: $EVENT_NAME"
              exit 1
              ;;
          esac

          case "$mode" in
            all)
              daily=true
              weekly=true
              ;;
            daily)
              daily=true
              ;;
            weekly)
              daily=true
              weekly=true
              ;;
            validate)
              run_operations=false
              ;;
            *)
              echo "::error::Invalid mode: $mode"
              exit 1
              ;;
          esac

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "daily=$daily" >> "$GITHUB_OUTPUT"
          echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
          echo "run_operations=$run_operations" >> "$GITHUB_OUTPUT"
          echo "restore_state=$restore_state" >> "$GITHUB_OUTPUT"
          echo "publish_snapshots=$publish_snapshots" >> "$GITHUB_OUTPUT"

          {
            echo "### Unified Platform mode"
            echo "- Event: \`$EVENT_NAME\`"
            echo "- Mode: \`$mode\`"
            echo "- Daily: \`$daily\`"
            echo "- Weekly: \`$weekly\`"
            echo "- Operations: \`$run_operations\`"
            echo "- Restore state: \`$restore_state\`"
            echo "- Publish snapshots: \`$publish_snapshots\`"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Repository and policy checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Verify repository structure
        shell: bash
        run: |
          set -euo pipefail

          required_paths=(
            platform
            platform/pyproject.toml
            platform/app
            discord-mcp
            discord-mcp/requirements.txt
            discord-mcp/server.py
            discord-mcp/indexer.py
            discord-mcp/news.py
            discord-mcp/intelligence.py
            rust/Cargo.toml
            genesis/engine/rust/Cargo.toml
            genesis/engine/go/go.mod
            genesis/engine/typescript/package.json
            genesis/engine/cpp/CMakeLists.txt
            genesis/engine/csharp
          )

          for path in "${required_paths[@]}"; do
            [[ -e "$path" ]] || {
              echo "::error::Required path missing: $path"
              exit 1
            }
          done

      - name: Detect tracked SQLite runtime state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files -z | grep -zEq '\\.db(-wal|-shm)?$'; then
            echo "::error::Runtime SQLite databases must not be tracked in Git."
            git ls-files | grep -E '\\.db(-wal|-shm)?$' || true
            exit 1
          fi

      - name: Validate JSON in repository data
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          for root in (Path("platform/data"),):
              if not root.exists():
                  continue
              for path in sorted(root.glob("*.json")):
                  with path.open("r", encoding="utf-8") as fh:
                      json.load(fh)
                  print(f"validated {path}")
          PY

      - name: Validate text whitespace
        run: git diff --check

  validate-platform:
    name: Python platform tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform/pyproject.toml

      - name: Platform tests
        working-directory: platform
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
          python -m pytest -q
          python -m compileall -q app

  validate-discord:
    name: Discord MCP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: discord-mcp/requirements.txt

      - name: Discord MCP tests
        working-directory: discord-mcp
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PYTHONDONTWRITEBYTECODE: "1"
          MCP_AUTH_TOKEN: test-test-test-test-test-test-test-test-test-test-test-test
          DISCORD_BOT_TOKEN: test
          DISCORD_GUILD_ID: "1"
          DISCORD_DB_PATH: ${{ runner.temp }}/discord-mcp-test.db
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m unittest discover -s . -p "test_*.py" -v
          python -m py_compile \
            server.py indexer.py bot.py run.py auth.py news.py intelligence.py oauth.py
          python -c "from server import mcp; print(type(mcp).__name__)"

  validate-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Root Rust tests
        working-directory: rust
        run: |
          set -euo pipefail
          cargo test

      - name: Genesis Rust QA tests
        working-directory: genesis/engine/rust
        run: |
          set -euo pipefail
          cargo test

  validate-go:
    name: Go worker tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: genesis/engine/go/go.mod

      - name: Test Genesis Go worker
        working-directory: genesis/engine/go
        run: |
          set -euo pipefail
          go test ./...

  validate-typescript:
    name: TypeScript contract typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: genesis/engine/typescript/package.json

      - name: Install TypeScript contract dependencies
        working-directory: genesis/engine/typescript
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Typecheck contract
        working-directory: genesis/engine/typescript
        run: npm run typecheck

  validate-cpp:
    name: C++ native build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure C++ native engine
        run: |
          set -euo pipefail
          cmake -S genesis/engine/cpp -B build/genesis-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build C++ native engine
        run: cmake --build build/genesis-native --parallel

  validate-csharp:
    name: C# native bridge build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build C# bridge
        working-directory: genesis/engine/csharp
        run: dotnet build --configuration Release

  build-runtime:
    name: Build validated polyglot runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - validate-platform
      - validate-discord
      - validate-rust
      - validate-go
      - validate-typescript
      - validate-cpp
      - validate-csharp
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: genesis/engine/go/go.mod

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build root Rust QA binary
        working-directory: rust
        run: cargo build --bin mdfarsi-qa

      - name: Build Genesis Go worker
        working-directory: genesis/engine/go
        run: go build -trimpath -o worker ./cmd/worker

      - name: Build Genesis C++ native probe
        run: |
          set -euo pipefail
          cmake -S genesis/engine/cpp -B build/genesis-native \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build/genesis-native --parallel

      - name: Build Genesis C# bridge
        working-directory: genesis/engine/csharp
        run: dotnet build --configuration Release

      - name: Assemble runtime bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/polyglot

          binaries=(
            "rust/target/debug/mdfarsi-qa"
            "genesis/engine/go/worker"
            "build/genesis-native/md_native_probe"
            "genesis/engine/csharp/bin/Release/net10.0/MDNativeBridge"
          )

          for binary in "${binaries[@]}"; do
            [[ -f "$binary" ]] || {
              echo "::error::Expected runtime binary missing: $binary"
              exit 1
            }
            cp "$binary" dist/polyglot/
          done

          chmod +x dist/polyglot/*
          sha256sum dist/polyglot/* > dist/SHA256SUMS
          file dist/polyglot/*

      - name: Upload validated runtime artifact
        uses: actions/upload-artifact@v7
        with:
          name: polyglot-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  integration-smoke:
    name: Cross-component smoke validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-runtime
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download validated runtime artifact
        uses: actions/download-artifact@v8
        with:
          name: polyglot-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/polyglot

      - name: Verify artifact hashes
        working-directory: ${{ runner.temp }}/polyglot
        run: |
          set -euo pipefail
          sha256sum -c dist/SHA256SUMS

      - name: Verify runtime executables
        working-directory: ${{ runner.temp }}/polyglot
        run: |
          set -euo pipefail
          for binary in dist/polyglot/*; do
            test -x "$binary"
            file "$binary"
          done

      - name: Verify Python integration surface
        run: |
          set -euo pipefail
          python -m compileall -q platform/app discord-mcp

  preflight-secrets:
    name: Operational secret preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - resolve-mode
      - integration-smoke
    if: needs.resolve-mode.outputs.run_operations == 'true'
    permissions:
      contents: read
    steps:
      - name: Verify required runtime secrets exist
        shell: bash
        env:
          PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          CHANNEL_STATS: ${{ secrets.CHANNEL_STATS }}
          CHANNEL_PROGRESS: ${{ secrets.CHANNEL_PROGRESS }}
          CHANNEL_ACHIEVEMENTS: ${{ secrets.CHANNEL_ACHIEVEMENTS }}
          CHANNEL_HEALTH: ${{ secrets.CHANNEL_HEALTH }}
          CHANNEL_REPORTS: ${{ secrets.CHANNEL_REPORTS }}
          CHANNEL_GLOSSARY: ${{ secrets.CHANNEL_GLOSSARY }}
        run: |
          set -euo pipefail
          required=(
            PARATRANZ_TOKEN
            DISCORD_BOT_TOKEN
            DISCORD_GUILD_ID
            CHANNEL_STATS
            CHANNEL_PROGRESS
            CHANNEL_ACHIEVEMENTS
            CHANNEL_HEALTH
            CHANNEL_REPORTS
            CHANNEL_GLOSSARY
          )

          for key in "${required[@]}"; do
            [[ -n "${!key:-}" ]] || {
              echo "::error::Required secret/variable is missing: $key"
              exit 1
            }
          done

  operate:
    name: Run coordinated platform operations
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs:
      - resolve-mode
      - build-runtime
      - preflight-secrets
    if: needs.resolve-mode.outputs.run_operations == 'true'
    permissions:
      contents: read
      actions: read
    outputs:
      public_artifact: ${{ steps.artifact-names.outputs.public_artifact }}
    env:
      PARATRANZ_TOKEN: ${{ secrets.PARATRANZ_TOKEN }}
      PARATRANZ_PROJECT_ID: ${{ env.PARATRANZ_PROJECT_ID }}
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
      CHANNEL_STATS: ${{ secrets.CHANNEL_STATS }}
      CHANNEL_PROGRESS: ${{ secrets.CHANNEL_PROGRESS }}
      CHANNEL_ACHIEVEMENTS: ${{ secrets.CHANNEL_ACHIEVEMENTS }}
      CHANNEL_HEALTH: ${{ secrets.CHANNEL_HEALTH }}
      CHANNEL_REPORTS: ${{ secrets.CHANNEL_REPORTS }}
      CHANNEL_GLOSSARY: ${{ secrets.CHANNEL_GLOSSARY }}
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: platform/pyproject.toml

      - name: Download validated polyglot binaries
        uses: actions/download-artifact@v8
        with:
          name: polyglot-binaries-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}

      - name: Restore executable permissions for validated binaries
        shell: bash
        run: |
          set -euo pipefail
          chmod +x \
            "$GITHUB_WORKSPACE/dist/polyglot/mdfarsi-qa" \
            "$GITHUB_WORKSPACE/dist/polyglot/worker" \
            "$GITHUB_WORKSPACE/dist/polyglot/md_native_probe" \
            "$GITHUB_WORKSPACE/dist/polyglot/MDNativeBridge"

      - name: Prepare runtime data directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p \
            "$GITHUB_WORKSPACE/platform/data" \
            "$GITHUB_WORKSPACE/discord-mcp/data"

      - name: Restore latest verified durable runtime state
        if: needs.resolve-mode.outputs.restore_state == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_WORKFLOW: unified-platform.yml
        shell: bash
        run: |
          set -euo pipefail

          restore_root="$RUNNER_TEMP/previous-state"
          rm -rf "$restore_root"
          mkdir -p "$restore_root"
          restored=false

          while read -r run_id; do
            [[ -n "$run_id" ]] || continue

            artifact_name="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GH_REPO}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false and (.name | startswith("platform-run-"))) | .name' \
              | head -n 1)"

            [[ -n "$artifact_name" ]] || continue

            rm -rf "$restore_root"/*
            mkdir -p "$restore_root"

            if ! gh run download "$run_id" --name "$artifact_name" --dir "$restore_root"; then
              continue
            fi

            previous_platform="$restore_root/platform/data/platform.db"
            previous_discord="$restore_root/discord-mcp/data/discord.db"
            manifest="$restore_root/platform/data/runtime-manifest.json"

            new_format=false
            if [[ "$artifact_name" != "platform-run-$run_id" ]]; then
              new_format=true
            fi

            if [[ "$new_format" == "true" ]]; then
              [[ -s "$manifest" ]] || continue
              if ! python - "$manifest" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text(encoding="utf-8"))
          raise SystemExit(0 if data.get("state_verified") is True else 1)
          PY
              then
                continue
              fi
            fi

            if [[ ! -s "$previous_platform" ]]; then
              continue
            fi

            if ! python - "$previous_platform" "$previous_discord" <<'PY'
          import sqlite3, sys
          from pathlib import Path

          for raw in sys.argv[1:]:
              path = Path(raw)
              if not path.exists():
                  continue
              con = sqlite3.connect(path, timeout=30)
              try:
                  result = con.execute("PRAGMA integrity_check").fetchone()[0]
                  if result != "ok":
                      raise SystemExit(f"integrity check failed: {path}: {result}")
              finally:
                  con.close()
          PY
            then
              continue
            fi

            cp "$previous_platform" "$GITHUB_WORKSPACE/platform/data/platform.db"
            if [[ -s "$previous_discord" ]]; then
              cp "$previous_discord" "$GITHUB_WORKSPACE/discord-mcp/data/discord.db"
            fi

            echo "::notice::Restored verified runtime state from run $run_id ($artifact_name)"
            restored=true
            break
          done < <(
            gh run list \
              --workflow "$GH_WORKFLOW" \
              --branch main \
              --limit 20 \
              --json databaseId,status,conclusion \
              --jq '.[] | select(.status == "completed") | .databaseId'
          )

          if [[ "$restored" != "true" ]]; then
            echo "No verified previous runtime artifact found; using repository seed state."
          fi

      - name: Install platform
        working-directory: platform
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Index Discord history
        env:
          DISCORD_DB_PATH: data/discord.db
          DISCORD_BACKFILL_ON_START: "false"
        working-directory: discord-mcp
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt

          for attempt in 1 2 3; do
            if timeout 10m python - <<'PY'
          import asyncio
          from server import sync_server_history
          result = asyncio.run(sync_server_history())
          print(result)
          PY
            then
              break
            fi

            if [[ "$attempt" -eq 3 ]]; then
              echo "::error::Discord history indexing failed after 3 attempts."
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Build Discord project news digest
        env:
          DISCORD_DB_PATH: ${{ github.workspace }}/discord-mcp/data/discord.db
        working-directory: discord-mcp
        run: |
          set -euo pipefail
          timeout 10m python news.py \
            --db "$DISCORD_DB_PATH" \
            --hours 24 \
            --limit 12 \
            --output "$GITHUB_WORKSPACE/platform/data/discord_news.json" \
            --mark-read

      - name: Build Discord project intelligence
        env:
          DISCORD_DB_PATH: ${{ github.workspace }}/discord-mcp/data/discord.db
        working-directory: discord-mcp
        run: |
          set -euo pipefail
          timeout 10m python intelligence.py \
            --db "$DISCORD_DB_PATH" \
            --hours 24 \
            --limit 12 \
            --output "$GITHUB_WORKSPACE/platform/data/discord_intelligence.json"

      - name: Select operational arguments
        id: operation-flags
        env:
          RUN_MODE: ${{ needs.resolve-mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          args=()

          case "$RUN_MODE" in
            all)
              args+=(--daily --weekly)
              ;;
            daily)
              args+=(--daily)
              ;;
            weekly)
              args+=(--daily --weekly)
              ;;
            *)
              echo "::error::Unexpected operational mode: $RUN_MODE"
              exit 1
              ;;
          esac

          printf 'args<<EOF\n' >> "$GITHUB_OUTPUT"
          printf '%s\n' "${args[*]}" >> "$GITHUB_OUTPUT"
          printf 'EOF\n' >> "$GITHUB_OUTPUT"

      - name: Run coordinated platform jobs
        working-directory: platform
        shell: bash
        env:
          OPERATION_ARGS: ${{ steps.operation-flags.outputs.args }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2206
          args=( $OPERATION_ARGS )
          timeout 30m python -m app.orchestrator "${args[@]}"

      - name: Snapshot SQLite state consistently
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import shutil
          import sqlite3
          from datetime import datetime, timezone
          from pathlib import Path

          dbs = [
              Path("platform/data/platform.db"),
              Path("discord-mcp/data/discord.db"),
          ]

          def sha256(path: Path) -> str:
              h = hashlib.sha256()
              with path.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          db_state = {}
          all_valid = True

          for path in dbs:
              if not path.exists():
                  if path.name == "platform.db":
                      all_valid = False
                  continue

              source = sqlite3.connect(path, timeout=30)
              temp = path.with_suffix(path.suffix + ".snapshot-tmp")
              try:
                  source.execute("PRAGMA busy_timeout=30000")
                  source.execute("PRAGMA wal_checkpoint(TRUNCATE)")

                  if temp.exists():
                      temp.unlink()

                  target = sqlite3.connect(temp, timeout=30)
                  try:
                      source.backup(target, pages=256)
                      target.execute("PRAGMA journal_mode=DELETE")
                      target.commit()
                  finally:
                      target.close()
              finally:
                  source.close()

              os.replace(temp, path)

              verify = sqlite3.connect(path, timeout=30)
              try:
                  integrity = verify.execute("PRAGMA integrity_check").fetchone()[0]
                  user_version = verify.execute("PRAGMA user_version").fetchone()[0]
              finally:
                  verify.close()

              valid = integrity == "ok"
              all_valid &= valid
              db_state[path.as_posix()] = {
                  "sha256": sha256(path),
                  "bytes": path.stat().st_size,
                  "sqlite_user_version": user_version,
                  "integrity": integrity,
              }

          manifest = {
              "schema": 1,
              "state_verified": bool(all_valid),
              "workflow": os.environ.get("GITHUB_WORKFLOW"),
              "run_id": os.environ.get("GITHUB_RUN_ID"),
              "run_attempt": os.environ.get("GITHUB_RUN_ATTEMPT"),
              "sha": os.environ.get("GITHUB_SHA"),
              "ref": os.environ.get("GITHUB_REF"),
              "mode": os.environ.get("UNIFIED_MODE"),
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "databases": db_state,
          }

          out = Path("platform/data/runtime-manifest.json")
          out.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")

          if not all_valid:
              raise SystemExit("Runtime state snapshot failed integrity validation")
          PY
        env:
          UNIFIED_MODE: ${{ needs.resolve-mode.outputs.mode }}

      - name: Build public snapshot manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest="$GITHUB_WORKSPACE/platform/data/.public-snapshot-manifest"
          : > "$manifest"
          find "$GITHUB_WORKSPACE/platform/data" \
            -maxdepth 1 \
            -type f \
            -name '*.json' \
            ! -name 'discord_news.json' \
            ! -name 'discord_intelligence.json' \
            ! -name 'runtime-manifest.json' \
            -printf '%f\n' \
            | sort > "$manifest"

          echo "Public snapshot files:"
          cat "$manifest"

      - name: Write operational run summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "# MD Farsi Unified Platform"
            echo
            echo "- Mode: \`${{ needs.resolve-mode.outputs.mode }}\`"
            echo "- Run: \`${{ github.run_id }}\` / attempt \`${{ github.run_attempt }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Generated: \`$(date -u +'%Y-%m-%dT%H:%M:%SZ')\`"
            echo
            echo "## Runtime hashes"
            if [[ -f platform/data/runtime-manifest.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("platform/data/runtime-manifest.json").read_text(encoding="utf-8"))
          for path, info in data.get("databases", {}).items():
              print(f"- `{path}`: `{info.get('sha256')}`")
          PY
            fi
          } > platform/data/run-summary.md

          cat platform/data/run-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Define artifact names
        id: artifact-names
        shell: bash
        run: |
          set -euo pipefail
          echo "public_artifact=public-snapshots-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_OUTPUT"

      - name: Archive runtime SQLite and private snapshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform/data/platform.db
            platform/data/*.json
            platform/data/run-summary.md
            discord-mcp/data/discord.db
          if-no-files-found: warn
          retention-days: 30

      - name: Archive public JSON snapshots
        if: success() && needs.resolve-mode.outputs.publish_snapshots == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: public-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            platform/data/*.json
            platform/data/.public-snapshot-manifest
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish public JSON snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - resolve-mode
      - operate
    if: >-
      needs.operate.result == 'success' &&
      needs.resolve-mode.outputs.publish_snapshots == 'true' &&
      needs.resolve-mode.outputs.run_operations == 'true'
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
          fetch-depth: 0

      - name: Download public snapshot artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.operate.outputs.public_artifact }}
          path: ${{ runner.temp }}/public-snapshots

      - name: Synchronize generated JSON snapshots
        shell: bash
        run: |
          set -euo pipefail

          src="$RUNNER_TEMP/public-snapshots"
          manifest="$src/.public-snapshot-manifest"

          [[ -s "$manifest" ]] || {
            echo "::error::Public snapshot manifest is missing or empty."
            exit 1
          }

          mkdir -p platform/data

          # Delete tracked generated snapshots which are no longer emitted.
          while IFS= read -r tracked; do
            base="$(basename "$tracked")"
            case "$base" in
              discord_news.json|discord_intelligence.json)
                continue
                ;;
            esac

            if ! grep -Fxq "$base" "$manifest"; then
              git rm -f "$tracked"
            fi
          done < <(git ls-files 'platform/data/*.json')

          while IFS= read -r base; do
            [[ -n "$base" ]] || continue
            [[ -f "$src/$base" ]] || {
              echo "::error::Manifested snapshot is missing from artifact: $base"
              exit 1
            }
            cp "$src/$base" "platform/data/$base"
          done < "$manifest"

      - name: Commit public snapshot changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git diff --check
          git add -A -- platform/data

          if git diff --cached --quiet; then
            echo "No public JSON snapshot changes to publish."
            exit 0
          fi

          git commit -m "chore: refresh public platform snapshots"

      - name: Publish with optimistic concurrency
        shell: bash
        run: |
          set -euo pipefail

          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                exit 0
              fi
            else
              unresolved=false
              while IFS= read -r conflicted; do
                [[ -n "$conflicted" ]] || continue
                if [[ "$conflicted" == platform/data/*.json ]]; then
                  git checkout --theirs -- "$conflicted"
                  git add "$conflicted"
                else
                  unresolved=true
                fi
              done < <(git diff --name-only --diff-filter=U)

              if [[ "$unresolved" == "false" ]] && ! git diff --name-only --diff-filter=U | grep -q .; then
                if GIT_EDITOR=true git rebase --continue; then
                  if git push origin HEAD:main; then
                    exit 0
                  fi
                else
                  git rebase --abort || true
                fi
              else
                git rebase --abort || true
              fi
            fi

            git rebase --abort 2>/dev/null || true
            sleep "$((attempt * 3))"
          done

          echo "::error::Failed to publish public JSON snapshots after 3 attempts."
          exit 1

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### Snapshot publication"
            echo "- Result: \`${{ job.status }}\`"
            echo "- Source artifact: \`${{ needs.operate.outputs.public_artifact }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  status:
    name: Unified pipeline status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs:
      - resolve-mode
      - quality
      - validate-platform
      - validate-discord
      - validate-rust
      - validate-go
      - validate-typescript
      - validate-cpp
      - validate-csharp
      - build-runtime
      - integration-smoke
      - preflight-secrets
      - operate
      - publish
    permissions:
      contents: read
    steps:
      - name: Write final status summary
        shell: bash
        env:
          RESOLVE: ${{ needs.resolve-mode.result }}
          QUALITY: ${{ needs.quality.result }}
          PLATFORM: ${{ needs.validate-platform.result }}
          DISCORD: ${{ needs.validate-discord.result }}
          RUST: ${{ needs.validate-rust.result }}
          GO: ${{ needs.validate-go.result }}
          TYPESCRIPT: ${{ needs.validate-typescript.result }}
          CPP: ${{ needs.validate-cpp.result }}
          CSHARP: ${{ needs.validate-csharp.result }}
          BUILD: ${{ needs.build-runtime.result }}
          INTEGRATION: ${{ needs.integration-smoke.result }}
          PREFLIGHT: ${{ needs.preflight-secrets.result }}
          OPERATE: ${{ needs.operate.result }}
          PUBLISH: ${{ needs.publish.result }}
        run: |
          set -euo pipefail
          {
            echo "# MD Farsi Unified Platform — Final Status"
            echo
            echo "| Stage | Result |"
            echo "|---|---|"
            echo "| Resolve mode | $RESOLVE |"
            echo "| Repository quality | $QUALITY |"
            echo "| Python platform | $PLATFORM |"
            echo "| Discord MCP | $DISCORD |"
            echo "| Rust | $RUST |"
            echo "| Go | $GO |"
            echo "| TypeScript | $TYPESCRIPT |"
            echo "| C++ | $CPP |"
            echo "| C# | $CSHARP |"
            echo "| Runtime build | $BUILD |"
            echo "| Integration smoke | $INTEGRATION |"
            echo "| Secret preflight | $PREFLIGHT |"
            echo "| Operations | $OPERATE |"
            echo "| Public publish | $PUBLISH |"
          } | tee "$GITHUB_STEP_SUMMARY"

          failed=0
          for value in "$RESOLVE" "$QUALITY" "$PLATFORM" "$DISCORD" "$RUST" "$GO" "$TYPESCRIPT" "$CPP" "$CSHARP" "$BUILD" "$INTEGRATION" "$PREFLIGHT" "$OPERATE" "$PUBLISH"; do
            if [[ "$value" == "failure" ]]; then
              failed=1
            fi
          done

          # Skipped operations/publish are valid on PRs and validation-only runs.
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
